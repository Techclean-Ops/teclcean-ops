<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TC H&amp;S">
<title>TechClean H&amp;S</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Familjen+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Same colours and fonts as the TechClean schedule (dark, lime accent). Red stays for stop / danger only. */
:root{color-scheme:dark;--bg:#2B2D2F;--card:#3C3F42;--surface:#333538;--line:#4A4D50;--line2:#5A5D61;--text:#F0F0F0;--dim:#A8AAAD;--muted:#78797C;
--lime:#A8C800;--lime-d:#7A9200;--lime-lt:rgba(168,200,0,.16);--orange:#E8720C;--green:#4CAF50;--green-d:#2E7D32;--red:#EF4444;--red-d:#c62828;--amber:#F59E0B;--ink:#111;
--font:'Familjen Grotesk',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;--mono:'DM Mono',ui-monospace,monospace;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:17px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.top{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:3px solid var(--lime)}
.top .logo{height:22px;display:block;margin-bottom:12px}
.top h1{margin:0;font-size:25px;font-weight:700}
.top .sub{color:var(--dim);font-size:14px;margin-top:2px;font-family:var(--mono)}
.top .row{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;color:#fff;font-size:28px;padding:0 6px 0 0;line-height:1;min-width:44px;min-height:44px;text-align:left}
.banner{background:#4a3a0c;color:#FCD34D;font-weight:700;font-size:15px;padding:10px 16px}
.banner.ok{background:#1f3a22;color:#86d48a}
.banner.err{background:#4a1d1d;color:#fca5a5}
.body{flex:1;padding:14px 14px calc(190px + var(--safe-b))}
.card{background:var(--card);color:var(--text);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
button.card{border:1px solid var(--line)!important}
.job{border-left:5px solid var(--lime)}
.job h2{margin:0 0 6px;font-size:21px}
.job .meta{color:var(--dim);font-size:14px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-family:var(--mono)}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:13px;white-space:nowrap;border:0}
.chip.cls{background:var(--lime);color:#1A1A1A}
.chip.done{background:rgba(76,175,80,.18);color:#86d48a}
.chip.todo{background:rgba(239,68,68,.2);color:#fca5a5}
.chip.new{background:rgba(245,158,11,.2);color:#FCD34D}
.chip.lock{background:#46494c;color:var(--dim)}
.chip.wait{background:rgba(59,130,246,.2);color:#93c5fd}
.tile{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:14px;padding:16px;margin-bottom:12px;text-align:left;min-height:76px}
.tile:active{transform:scale(.99);background:var(--surface)}
.tile .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.tile .tx{flex:1;font-size:20px;font-weight:700}
.tile[disabled]{opacity:.5}
.ic.g{background:rgba(76,175,80,.2)}.ic.r{background:rgba(239,68,68,.2)}.ic.y{background:rgba(168,200,0,.2)}.ic.p{background:rgba(167,139,250,.2)}.ic.b{background:rgba(59,130,246,.2)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 70%,rgba(43,45,47,0));max-width:520px;margin:0 auto}
.btn{display:block;width:100%;border:0;border-radius:12px;background:var(--lime);color:#1A1A1A;font-size:21px;font-weight:700;padding:18px;min-height:62px}
.btn:active{background:var(--lime-d)}
.btn[disabled]{background:#4A4D50;color:var(--muted)}
.btn.sec{background:var(--surface);color:var(--text);border:1px solid var(--line2)}
.btn.dark{background:var(--ink);color:#fff}
.btn+.btn{margin-top:10px}
.progress{height:8px;background:var(--line);border-radius:9px;margin:12px 0 14px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--lime);border-radius:9px;transition:width .2s}
.q{font-size:24px;font-weight:700;margin:6px 0 6px}
.help{color:var(--dim);font-size:16px;margin:0 0 14px}
.sect{color:var(--dim);font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;font-family:var(--mono)}
.yn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.yn.two{grid-template-columns:repeat(2,1fr)}
.yn button{border:1px solid var(--line2);background:var(--surface);border-radius:12px;font-size:22px;font-weight:700;min-height:84px;color:var(--text)}
.yn button.on.good{background:var(--green-d);border-color:var(--green);color:#fff}
.yn button.on.bad{background:var(--red-d);border-color:var(--red);color:#fff}
.yn button.on.na{background:#5A5D61;border-color:#78797C;color:#fff}
.pics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.pics button{border:1px solid var(--line2);background:var(--surface);border-radius:12px;min-height:110px;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.pics button span{font-size:38px}
.pics button.on{border:2px solid var(--lime);background:var(--lime-lt);color:#d9f05a}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:12px 16px;font-size:18px;font-weight:600;min-height:54px}
.chips button.on{border:2px solid var(--lime);background:var(--lime-lt);color:#d9f05a}
.chips button[disabled]{opacity:.4}
.lbl{font-size:13px;font-weight:600;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin:18px 0 8px;font-family:var(--mono)}
.warn{color:#fca5a5;font-weight:700;font-size:16px;margin-top:12px}
textarea,input[type=text],input[type=tel],input[type=time],input[type=date],input[type=number],select{width:100%;border:1px solid var(--line2);border-radius:12px;padding:14px;font:inherit;font-size:18px;background:var(--surface)!important;color:var(--text)!important}
textarea:focus,input:focus{outline:2px solid var(--lime);border-color:var(--lime)}
textarea{min-height:110px;resize:vertical}
::placeholder{color:var(--muted)}
.voice{position:relative}
.mic{position:absolute;right:8px;bottom:8px;width:52px;height:52px;border-radius:50%;border:0;background:#1A1A1A;color:#fff;font-size:24px}
.mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.photo{border:2px dashed var(--line2);border-radius:12px;min-height:110px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;background:var(--surface);font-weight:700;color:var(--dim);padding:8px;width:100%}
.photo img{height:90px;border-radius:8px}
.sigwrap{background:#fff;border:1px solid var(--line2);border-radius:12px;position:relative;color:#111}
.sigwrap canvas{display:block;width:100%;height:190px;touch-action:none}
.sigwrap .clear{position:absolute;right:8px;top:8px;border:0;background:#eee;color:#111;border-radius:10px;padding:8px 12px;font-weight:700}
.sigwrap .hint{position:absolute;left:14px;bottom:10px;color:#999;font-size:15px;pointer-events:none}
.crew{display:flex;align-items:center;gap:12px;background:var(--card);color:var(--text);border-radius:12px;padding:14px;margin-bottom:10px;border:1px solid var(--line);width:100%;text-align:left;min-height:70px}
.crew .nm{flex:1;font-size:19px;font-weight:700}
.crew .st{font-size:13px;color:var(--dim);font-weight:600;font-family:var(--mono)}
.crew.signed{border:2px solid var(--green)}
.big{font-size:56px;text-align:center;margin:14px 0 4px}
.center{text-align:center}
.stop{background:var(--red-d);color:#fff;border-radius:14px;padding:22px;text-align:center}
.stop h2{margin:6px 0 8px;font-size:26px}
.small{font-size:14px;color:var(--dim)}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.link{background:none;border:0;color:var(--dim);text-decoration:underline;font-size:15px;padding:10px}
.demo{margin-top:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:#111;color:#fff;border:1px solid var(--lime);padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;max-width:90%;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="forms.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
