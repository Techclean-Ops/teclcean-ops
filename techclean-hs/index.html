<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="TC H&amp;S">
<title>TechClean H&amp;S</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{--red:#E8192C;--red-d:#c8102e;--grey:#595959;--ink:#111;--bg:#f2f2f2;--card:#fff;--green:#2e7d32;--amber:#f5c518;--line:#dedede;--safe-b:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;font-size:17px;line-height:1.35}
button{font:inherit;color:inherit;cursor:pointer}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg)}
.top{background:var(--ink);color:#fff;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 16px;border-bottom:4px solid var(--red)}
.top .logo{height:22px;display:block;margin-bottom:12px}
.top h1{margin:0;font-size:25px;font-weight:800}
.top .sub{color:#cfcfcf;font-size:15px;margin-top:2px}
.top .row{display:flex;align-items:center;gap:12px}
.back{background:none;border:0;color:#fff;font-size:28px;padding:0 6px 0 0;line-height:1;min-width:44px;min-height:44px;text-align:left}
.banner{background:#fff3c4;color:#6b4f00;font-weight:700;font-size:15px;padding:10px 16px}
.banner.ok{background:#e6f4e7;color:#1d5e20}
.banner.err{background:#fde3e5;color:#9a0f1d}
.body{flex:1;padding:14px 14px calc(190px + var(--safe-b))}
.card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.job{border-left:6px solid var(--amber)}
.job h2{margin:0 0 6px;font-size:21px}
.job .meta{color:#555;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-weight:700;font-size:14px;white-space:nowrap}
.chip.cls{background:var(--amber);color:#000}
.chip.done{background:#e3f3e4;color:var(--green)}
.chip.todo{background:#fde3e5;color:#b3121f}
.chip.new{background:#fff1bf;color:#7a5b00}
.chip.lock{background:#ececec;color:#777}
.chip.wait{background:#e8eefc;color:#2346a0}
.tile{display:flex;align-items:center;gap:14px;width:100%;border:0;background:var(--card);border-radius:16px;padding:16px;margin-bottom:12px;text-align:left;min-height:76px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tile:active{transform:scale(.99);background:#fafafa}
.tile .ic{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:26px;flex:none}
.tile .tx{flex:1;font-size:20px;font-weight:700}
.tile[disabled]{opacity:.55}
.ic.g{background:#e3f3e4}.ic.r{background:#fde3e5}.ic.y{background:#fff1bf}.ic.p{background:#efe3fb}.ic.b{background:#e3ecfb}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 14px calc(12px + var(--safe-b));background:linear-gradient(to top,var(--bg) 70%,rgba(242,242,242,0));max-width:520px;margin:0 auto}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--red);color:#fff;font-size:21px;font-weight:800;padding:18px;min-height:62px}
.btn:active{background:var(--red-d)}
.btn[disabled]{background:#c9c9c9;color:#fff}
.btn.sec{background:#fff;color:var(--ink);border:2px solid var(--line)}
.btn.dark{background:var(--ink)}
.btn+.btn{margin-top:10px}
.progress{height:8px;background:#ddd;border-radius:9px;margin:12px 0 14px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--red);border-radius:9px;transition:width .2s}
.q{font-size:24px;font-weight:800;margin:6px 0 6px}
.help{color:#555;font-size:16px;margin:0 0 14px}
.sect{color:#777;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.yn{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.yn.two{grid-template-columns:repeat(2,1fr)}
.yn button{border:2px solid var(--line);background:#fff;border-radius:14px;font-size:22px;font-weight:800;min-height:84px;color:#555}
.yn button.on.good{background:var(--green);border-color:var(--green);color:#fff}
.yn button.on.bad{background:#c62828;border-color:#c62828;color:#fff}
.yn button.on.na{background:#555;border-color:#555;color:#fff}
.pics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.pics button{border:2px solid var(--line);background:#fff;border-radius:14px;min-height:110px;font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.pics button span{font-size:38px}
.pics button.on{border-color:var(--red);background:#fff0f1;color:var(--red-d)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chips button{border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 16px;font-size:18px;font-weight:700;min-height:54px}
.chips button.on{border-color:var(--red);background:#fff0f1;color:var(--red-d)}
.lbl{font-size:14px;font-weight:800;color:#555;text-transform:uppercase;letter-spacing:.05em;margin:18px 0 8px}
.warn{color:#c62828;font-weight:700;font-size:16px;margin-top:12px}
textarea,input[type=text],input[type=tel],input[type=time]{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font:inherit;font-size:18px;background:#fff}
textarea{min-height:110px;resize:vertical}
.voice{position:relative}
.mic{position:absolute;right:8px;bottom:8px;width:52px;height:52px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:24px}
.mic.on{background:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
.photo{border:2px dashed #bbb;border-radius:14px;min-height:110px;display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;background:#fff;font-weight:700;color:#666;padding:8px;width:100%}
.photo img{height:90px;border-radius:8px}
.sigwrap{background:#fff;border:2px solid var(--line);border-radius:14px;position:relative}
.sigwrap canvas{display:block;width:100%;height:190px;touch-action:none}
.sigwrap .clear{position:absolute;right:8px;top:8px;border:0;background:#eee;border-radius:10px;padding:8px 12px;font-weight:700}
.sigwrap .hint{position:absolute;left:14px;bottom:10px;color:#aaa;font-size:15px;pointer-events:none}
.crew{display:flex;align-items:center;gap:12px;background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;border:2px solid transparent;width:100%;text-align:left;min-height:70px}
.crew .nm{flex:1;font-size:19px;font-weight:700}
.crew .st{font-size:14px;color:#666;font-weight:600}
.crew.signed{border-color:var(--green)}
.big{font-size:56px;text-align:center;margin:14px 0 4px}
.center{text-align:center}
.stop{background:#c62828;color:#fff;border-radius:16px;padding:22px;text-align:center}
.stop h2{margin:6px 0 8px;font-size:26px}
.small{font-size:14px;color:#666}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid #eee}
.list .it:last-child{border:0}
.link{background:none;border:0;color:#666;text-decoration:underline;font-size:15px;padding:10px}
.demo{margin-top:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700;z-index:9;max-width:90%;text-align:center}
.hidden{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script src="config.js"></script>
<script src="forms.js"></script>
<script src="jspdf.umd.min.js"></script>
<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
